<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!--
  Template: Criativo Educativo (Story + Post, 1 insight por peça)
  Squad AgêncIA 100k, Agente 03-Design/Criativos
  Story: 1080x1920 (9:16) · Post: 1080x1350 (4:5)
  A foto é a base da composição (princípio 2 do SKILL.md). Sem foto, não uso este template.
  Como exportar PNG: ver exportar-png.md
  Trocar todos os {{PLACEHOLDER}} pelos dados reais do briefing, incluindo {{URL_FOTO}}.
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criativo Educativo: {{TITULO_CRIATIVO}}</title>

<style>
:root {
  --color-primary: {{COR_PRIMARIA_HEX}};
  --color-primary-dark: {{COR_PRIMARIA_DARK_HEX}};
  --color-accent: {{COR_ACCENT_HEX}};
  --color-text: #1a1a1a;
  --color-text-soft: #4a4a4a;
  --color-bg: #ffffff;
  --color-bg-alt: #f7f7f5;
  --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-stack);
  background: #e0e0e0;
  padding: 40px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.preview-info {
  background: #fff;
  padding: 16px 24px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--color-text-soft);
  max-width: 1080px;
}
.preview-info strong { color: var(--color-text); }

.creative {
  width: 1080px;
  background: var(--color-bg);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.creative__brand-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: var(--color-primary);
  z-index: 1;
}

.creative__photo-wrap {
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.creative__photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.creative__logo {
  position: absolute;
  top: 32px;
  left: 80px;
  z-index: 1;
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,0.35);
}

.creative__body-wrap {
  flex: 1;
  padding: 56px 80px 96px;
  display: flex;
  flex-direction: column;
}

.creative__eyebrow {
  display: inline-block;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 28px;
}

.creative__headline {
  font-size: 68px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--color-text);
  margin-bottom: 28px;
  letter-spacing: -0.02em;
}

.creative__body {
  font-size: 32px;
  line-height: 1.45;
  color: var(--color-text-soft);
  font-weight: 400;
}

.creative__body strong { color: var(--color-text); font-weight: 700; }

.creative__cta-suave {
  margin-top: auto;
  padding-top: 32px;
  font-size: 24px;
  color: var(--color-primary);
  font-weight: 700;
}

/* STORY: 1080x1920. Topo e rodapé ~250px são zona de segurança do Instagram
   (nome de usuário/ícones no topo, caixa de resposta no rodapé). A foto cobre o
   topo (fica sob os ícones do Instagram sem problema), o texto fica sempre abaixo. */
.creative--story { height: 1920px; }
.creative--story .creative__photo-wrap { height: 950px; }
.creative--story .creative__body-wrap { padding-bottom: 300px; }

/* POST: 1080x1350, feed do Instagram */
.creative--post { height: 1350px; }
.creative--post .creative__photo-wrap { height: 620px; }
.creative--post .creative__body-wrap { padding-bottom: 80px; }
</style>
</head>

<body>

<div class="preview-info">
  <strong>Criativo Educativo:</strong> {{TITULO_CRIATIVO}} para {{NOME_CLIENTE}}.
  <br>1 insight por peça, Story (1080x1920) + Post (1080x1350). Para exportar PNG, ver <code>exportar-png.md</code>.
</div>

<!-- STORY -->
<article class="creative creative--story" id="story">
  <div class="creative__brand-bar"></div>
  <div class="creative__photo-wrap">
    <img src="{{URL_FOTO}}" alt="{{NOME_CLIENTE}}">
  </div>
  <div class="creative__logo">{{NOME_CLIENTE}}</div>
  <div class="creative__body-wrap">
    <span class="creative__eyebrow">{{EYEBROW}}</span>
    <h1 class="creative__headline">{{HEADLINE}}</h1>
    <p class="creative__body">{{BODY}}</p>
    <div class="creative__cta-suave">{{CTA_SUAVE}}</div>
  </div>
</article>

<!-- POST -->
<article class="creative creative--post" id="post">
  <div class="creative__brand-bar"></div>
  <div class="creative__photo-wrap">
    <img src="{{URL_FOTO}}" alt="{{NOME_CLIENTE}}">
  </div>
  <div class="creative__logo">{{NOME_CLIENTE}}</div>
  <div class="creative__body-wrap">
    <span class="creative__eyebrow">{{EYEBROW}}</span>
    <h1 class="creative__headline">{{HEADLINE}}</h1>
    <p class="creative__body">{{BODY}}</p>
    <div class="creative__cta-suave">{{CTA_SUAVE}}</div>
  </div>
</article>

</body>
</html>
