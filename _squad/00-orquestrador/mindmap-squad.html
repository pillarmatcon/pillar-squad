<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad AgêncIA - Exemplo Prático</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
  }

  svg {
    width: 100%;
    max-width: 1400px;
    height: auto;
    overflow: visible;
  }

  /* linhas */
  .line {
    stroke: #e8c66a;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
  }
  .line-thin {
    stroke: #e8c66a;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
  }

  /* nó raiz */
  .node-root rect {
    fill: #f5a623;
    rx: 10; ry: 10;
  }
  .node-root text {
    fill: #fff;
    font-size: 15px;
    font-weight: 700;
  }

  /* nó de categoria (primeiro nível) */
  .node-cat text {
    fill: #1a1a1a;
    font-size: 13.5px;
    font-weight: 600;
  }

  /* nó de detalhe (segundo nível) */
  .node-detail circle {
    fill: #f5a623;
  }
  .node-detail text {
    fill: #1a1a1a;
    font-size: 13px;
    font-weight: 400;
  }

  /* nó de destaque (italic) */
  .node-italic text {
    fill: #555;
    font-size: 13px;
    font-style: italic;
  }

  /* nó final (resultado) */
  .node-result text {
    fill: #1a1a1a;
    font-size: 13px;
    font-weight: 400;
  }

  /* seta de ação */
  .arrow {
    fill: none;
    stroke: #ccc;
    stroke-width: 1.5;
    marker-end: url(#arrowhead);
  }
</style>
</head>
<body>
<svg viewBox="0 0 1380 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bbb" />
    </marker>
  </defs>

  <!-- ═══════════════════════════════════
       NÓ RAIZ
  ══════════════════════════════════════ -->
  <!-- caixa raiz -->
  <g class="node-root">
    <rect x="20" y="235" width="200" height="52" rx="10" ry="10" fill="#f5a623"/>
    <text x="120" y="256" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="system-ui">Exemplo prático:</text>
    <text x="120" y="275" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="system-ui">squad em ação</text>
  </g>

  <!-- ═══════════════════════════════════
       LINHA PRINCIPAL horizontal
  ══════════════════════════════════════ -->
  <line class="line" x1="220" y1="261" x2="270" y2="261"/>

  <!-- ═══════════════════════════════════
       BLOCO 1: Você pede ao orquestrador
  ══════════════════════════════════════ -->
  <!-- fork vertical do tronco -->
  <line class="line" x1="270" y1="261" x2="270" y2="100"/>
  <line class="line" x1="270" y1="261" x2="270" y2="261"/>
  <line class="line" x1="270" y1="261" x2="270" y2="420"/>

  <!-- ramo: você pede -->
  <line class="line" x1="270" y1="100" x2="340" y2="100"/>
  <text x="345" y="96" font-size="13.5" font-weight="600" fill="#1a1a1a" font-family="system-ui">Você pede ao orquestrador</text>
  <!-- bullet filho -->
  <line class="line-thin" x1="356" y1="100" x2="356" y2="128"/>
  <line class="line-thin" x1="356" y1="128" x2="380" y2="128"/>
  <circle cx="374" cy="128" r="5" fill="#f5a623"/>
  <text x="388" y="132" font-size="13" fill="#555" font-style="italic" font-family="system-ui">"@orquestrador - cliente X, nicho Y, oferta Z, budget R$ 3.000"</text>

  <!-- ═══════════════════════════════════
       BLOCO 2: O orquestrador aciona o squad
  ══════════════════════════════════════ -->
  <!-- ramo central: orquestrador aciona -->
  <line class="line" x1="270" y1="261" x2="340" y2="261"/>
  <text x="345" y="257" font-size="13.5" font-weight="600" fill="#1a1a1a" font-family="system-ui">O orquestrador aciona o squad em sequência</text>

  <!-- 5 agentes em sequência -->
  <!-- agente 1 -->
  <line class="line-thin" x1="500" y1="261" x2="500" y2="185"/>
  <line class="line-thin" x1="500" y1="185" x2="530" y2="185"/>
  <circle cx="524" cy="185" r="5" fill="#f5a623"/>
  <text x="538" y="181" font-size="13" fill="#1a1a1a" font-family="system-ui" font-weight="600">Agente 01</text>
  <text x="538" y="198" font-size="12" fill="#777" font-family="system-ui">Tráfego → plano de campanha + UTMs + benchmarks</text>

  <!-- seta 1→2 -->
  <line class="arrow" x1="660" y1="185" x2="690" y2="185"/>

  <!-- agente 2 -->
  <line class="line-thin" x1="700" y1="261" x2="700" y2="185"/>
  <line class="line-thin" x1="700" y1="185" x2="730" y2="185"/>
  <circle cx="724" cy="185" r="5" fill="#f5a623"/>
  <text x="738" y="181" font-size="13" fill="#1a1a1a" font-family="system-ui" font-weight="600">Agente 02</text>
  <text x="738" y="198" font-size="12" fill="#777" font-family="system-ui">Copy → anúncios + headlines prontos</text>

  <!-- seta 2→3 -->
  <line class="arrow" x1="870" y1="185" x2="900" y2="185"/>

  <!-- agente 3 -->
  <line class="line-thin" x1="910" y1="261" x2="910" y2="185"/>
  <line class="line-thin" x1="910" y1="185" x2="940" y2="185"/>
  <circle cx="934" cy="185" r="5" fill="#f5a623"/>
  <text x="948" y="181" font-size="13" fill="#1a1a1a" font-family="system-ui" font-weight="600">Agente 03</text>
  <text x="948" y="198" font-size="12" fill="#777" font-family="system-ui">Criativos → HTML, Story + Post</text>

  <!-- seta 3→4 -->
  <line class="arrow" x1="1070" y1="185" x2="1100" y2="185"/>

  <!-- agente 4 -->
  <line class="line-thin" x1="1110" y1="261" x2="1110" y2="185"/>
  <line class="line-thin" x1="1110" y1="185" x2="1140" y2="185"/>
  <circle cx="1134" cy="185" r="5" fill="#f5a623"/>
  <text x="1148" y="181" font-size="13" fill="#1a1a1a" font-family="system-ui" font-weight="600">Agente 04</text>
  <text x="1148" y="198" font-size="12" fill="#777" font-family="system-ui">Páginas → LP HTML com pixel e SEO</text>

  <!-- seta 4→5 (desce para linha de baixo - agente 5 fica embaixo) -->
  <line class="arrow" x1="1270" y1="198" x2="1270" y2="230"/>

  <!-- agente 5 (abaixo, alinhado com os outros) -->
  <line class="line-thin" x1="1270" y1="261" x2="1300" y2="261"/>
  <circle cx="1294" cy="261" r="5" fill="#f5a623"/>
  <text x="1308" y="257" font-size="13" fill="#1a1a1a" font-family="system-ui" font-weight="600">Agente 05</text>
  <text x="1308" y="274" font-size="12" fill="#777" font-family="system-ui">Dashboard → metas + benchmarks do plano</text>

  <!-- ═══════════════════════════════════
       BLOCO 3: O que você recebe
  ══════════════════════════════════════ -->
  <!-- ramo inferior: o que você recebe -->
  <line class="line" x1="270" y1="420" x2="340" y2="420"/>
  <text x="345" y="416" font-size="13.5" font-weight="600" fill="#1a1a1a" font-family="system-ui">O que você recebe</text>

  <!-- sub-itens do bloco 3 -->
  <line class="line-thin" x1="356" y1="420" x2="356" y2="448"/>
  <line class="line-thin" x1="356" y1="448" x2="380" y2="448"/>
  <circle cx="374" cy="448" r="5" fill="#f5a623"/>
  <text x="388" y="452" font-size="13" fill="#1a1a1a" font-family="system-ui">Plano + copy + criativo + LP + dashboard - numa única conversa</text>

  <line class="line-thin" x1="356" y1="420" x2="356" y2="478"/>
  <line class="line-thin" x1="356" y1="478" x2="380" y2="478"/>
  <circle cx="374" cy="478" r="5" fill="#f5a623"/>
  <text x="388" y="482" font-size="13" fill="#1a1a1a" font-family="system-ui">Checklist de publicação - o que fazer antes de subir</text>

  <line class="line-thin" x1="356" y1="420" x2="356" y2="508"/>
  <line class="line-thin" x1="356" y1="508" x2="380" y2="508"/>
  <circle cx="374" cy="508" r="5" fill="#f5a623"/>
  <text x="388" y="512" font-size="13" fill="#1a1a1a" font-family="system-ui">Tudo alinhado - a copy do anúncio bate com o criativo, que bate com a LP</text>

</svg>
</body>
</html>
